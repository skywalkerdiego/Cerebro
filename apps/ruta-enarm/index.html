<title>Ruta ENARM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: app de una columna para iPhone — barra superior fija, ruta serpenteante al centro, pestañas abajo. Paleta Ravenclaw (azul y bronce) con girasol como recompensa. */
:root{
  --bg:#eef2f9; --surface:#ffffff; --soft:#e2e8f4; --line:#d2dae9;
  --ink:#14223b; --muted:#5b6983;
  --accent:#2c5bb0; --accent-d:#1c3f7e; --accent-soft:#dbe5f7;
  --bronze:#b98236; --bronze-d:#8a5f22; --bronze-soft:#f5e6cf; --sun:#f0b429; --sun-d:#c98a0c;
  --ok:#2c9a5f; --ok-d:#1f7446; --ok-soft:#daf2e4; --ok-ink:#1b6a40;
  --bad:#d14343; --bad-d:#a22f2f; --bad-soft:#fbe2e2; --bad-ink:#9c2b2b;
  --u-p:#2c5bb0; --u-p-d:#1c3f7e; --u-p-soft:#dbe5f7;
  --u-g:#c0507a; --u-g-d:#8f3858; --u-g-soft:#f8e0e9;
  --u-m:#24877c; --u-m-d:#196159; --u-m-soft:#d8efec;
  --lock:#cdd5e4; --lock-d:#aab6cc; --lock-ink:#7d8aa3;
  --dog:#d9a566; --dog-d:#9c6a33; --dog-l:#f6e3c6; --dog-ink:#2a1c10; --tongue:#ef7d8e;
  --xray:#141a26; --xray-t:#5c6679; --xray-air:#06080d; --xray-l:#d9e0ec;
  --skin:#f1c9a5; --cheek:#e2463f;
  --shadow:0 1px 2px rgba(20,34,59,.06),0 6px 18px rgba(20,34,59,.06);
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1221; --surface:#141e34; --soft:#1c2843; --line:#2a3857;
  --ink:#e9eefa; --muted:#9aa8c5;
  --accent:#5a88df; --accent-d:#355fae; --accent-soft:#1d2d52;
  --bronze:#d6a157; --bronze-d:#9d7231; --bronze-soft:#3a2e1c; --sun:#f3bf45; --sun-d:#b88414;
  --ok:#3bb877; --ok-d:#258553; --ok-soft:#143425; --ok-ink:#7fdcaa;
  --bad:#ec6767; --bad-d:#b04343; --bad-soft:#3b1b20; --bad-ink:#ffaaaa;
  --u-p:#5a88df; --u-p-d:#355fae; --u-p-soft:#1d2d52;
  --u-g:#d9739a; --u-g-d:#a24b6c; --u-g-soft:#3a1d2a;
  --u-m:#3aaa9d; --u-m-d:#257a70; --u-m-soft:#143430;
  --lock:#28344f; --lock-d:#1b2439; --lock-ink:#7484a3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1221; --surface:#141e34; --soft:#1c2843; --line:#2a3857;
  --ink:#e9eefa; --muted:#9aa8c5;
  --accent:#5a88df; --accent-d:#355fae; --accent-soft:#1d2d52;
  --bronze:#d6a157; --bronze-d:#9d7231; --bronze-soft:#3a2e1c; --sun:#f3bf45; --sun-d:#b88414;
  --ok:#3bb877; --ok-d:#258553; --ok-soft:#143425; --ok-ink:#7fdcaa;
  --bad:#ec6767; --bad-d:#b04343; --bad-soft:#3b1b20; --bad-ink:#ffaaaa;
  --u-p:#5a88df; --u-p-d:#355fae; --u-p-soft:#1d2d52;
  --u-g:#d9739a; --u-g-d:#a24b6c; --u-g-soft:#3a1d2a;
  --u-m:#3aaa9d; --u-m-d:#257a70; --u-m-soft:#143430;
  --lock:#28344f; --lock-d:#1b2439; --lock-ink:#7484a3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- barra superior ---------- */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;margin-right:auto}
.brand b{color:var(--bronze)}
.bico{display:inline-flex;width:26px;height:26px;color:var(--accent)}.bico svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-weight:800;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.pill svg{width:20px;height:20px}
.pill.flame{color:#e8792b}
.pill.flame.off{color:var(--lock-ink)}
.pill.gem{color:var(--sun-d)}

/* ---------- vista ---------- */
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.h-sec{font-size:22px;margin-top:6px}

/* botones 3D tipo juego */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-d)}
.btn[disabled]{background:var(--lock);color:var(--lock-ink);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.bronze{background:var(--bronze);box-shadow:0 4px 0 var(--bronze-d)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;width:auto;border-radius:13px}
.link{color:var(--accent);font-weight:800}

/* ---------- pestañas ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabsin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:800;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;text-align:center}

/* ---------- inicio ---------- */
.hello{display:flex;align-items:flex-end;gap:10px}
.hello .tris{width:84px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:11px 14px;font-weight:700;font-size:15px;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:74px;height:74px;position:relative}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1}
.ring .rl small{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px}
.quests{display:flex;flex-direction:column;gap:9px;min-width:0}
.q{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px;font-weight:700}
.q .qt{min-width:0}
.q .bar{grid-column:2/4;height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:-3px}
.q .bar i{display:block;height:100%;background:var(--sun);border-radius:5px}
.q.done .bar i{background:var(--ok)}
.q svg{width:20px;height:20px}
.q .rw{font-size:12px;color:var(--sun-d);display:flex;align-items:center;gap:2px}
.q .rw svg{width:15px;height:15px}
.idea{display:flex;gap:12px;align-items:flex-start}
.idea .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bronze-soft);color:var(--bronze-d)}
.idea .ico svg{width:22px;height:22px}
.idea .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.ideas{display:flex;flex-direction:column;gap:14px}
.ideas .idea + .idea{border-top:1px solid var(--line);padding-top:14px}

/* ---------- ruta ---------- */
.unit{border-radius:20px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--ud)}
.unit h2{font-size:21px;line-height:1.15}
.unit p{font-size:13px;font-weight:700;opacity:.92}
.unit .uicon{width:52px;height:52px;flex:none;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.unit .uicon svg{width:32px;height:32px}
.unit .ub{margin-left:auto;flex:none;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:7px 10px;font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:58px 0 30px}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--uc);box-shadow:0 7px 0 var(--ud);color:#fff;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node svg{width:34px;height:34px}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--lock-ink)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-d);color:#5a3b00}
.node.cur{outline:6px solid color-mix(in srgb,var(--uc) 28%,transparent);outline-offset:4px}
.node .cr{position:absolute;bottom:-6px;right:-6px;background:var(--surface);color:var(--bronze-d);border:2px solid var(--line);border-radius:10px;font-size:11px;font-weight:900;padding:1px 6px}
.node .start{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:900;font-size:13px;letter-spacing:.06em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node .start::after{content:"";position:absolute;bottom:-7px;left:50%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.nodelabel{font-size:13px;font-weight:800;color:var(--muted);max-width:150px;text-align:center;line-height:1.2}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}

/* ---------- hoja inferior ---------- */
#sheetWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap .scrim{position:absolute;inset:0;background:rgba(5,10,20,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-top:-10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.btnrow{display:flex;flex-direction:column;gap:12px}

/* ---------- ficha ---------- */
.ficha{display:flex;flex-direction:column;gap:12px}
.ficha .ftag{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--ucs);color:var(--uc)}
.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.keys li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.keys li::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--uc);margin-top:7px;transform:rotate(45deg)}
.dia{border-radius:16px;background:var(--soft);padding:12px;overflow-x:auto}
.dia svg{display:block;width:100%;height:auto;max-width:100%}
.dia .cap{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.t td:first-child{font-weight:800}
.tl{display:flex;flex-direction:column;gap:0}
.tl .st{display:grid;grid-template-columns:64px 18px 1fr;gap:8px;align-items:stretch}
.tl .st .w{font-weight:900;font-size:13px;text-align:right;padding-top:2px;color:var(--uc)}
.tl .st .ln{position:relative}
.tl .st .ln::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .st .ln::after{content:"";position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--uc);border:2px solid var(--soft)}
.tl .st .c{padding-bottom:12px;font-size:14px;font-weight:700}
.tl .st .c span{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 7px;margin:0 4px 4px 0;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.mini b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--uc)}
.mini span{font-size:12.5px;font-weight:600;color:var(--muted);display:block;line-height:1.3}

/* ---------- lección ---------- */
#lesson{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead{max-width:560px;width:100%;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.lhead .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.lhead .x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:9px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .35s ease;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.combo{flex:none;font-weight:900;color:#e8792b;display:flex;align-items:center;gap:2px;font-size:15px;min-width:42px;justify-content:flex-end}
.combo svg{width:20px;height:20px}
.lbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.lbodyin{max-width:560px;margin:0 auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:16px}
.qtype{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.qtext{font-size:18px;font-weight:700;line-height:1.45}
.qtext strong{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px;line-height:1.35;transition:transform .06s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{grid-template-columns:1fr;text-align:center;justify-items:center;padding:20px 10px;font-size:17px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{min-height:62px;padding:10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:14px;line-height:1.25;text-align:center}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.tile.ok{opacity:.35;border-color:var(--ok);box-shadow:none;background:var(--ok-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lfoot{border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.lfoot.ok{background:var(--ok-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.lfootin{max-width:560px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.fb{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.fb h3{font-size:21px;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:28px;height:28px;flex:none}
.lfoot.ok .fb h3{color:var(--ok-ink)}
.lfoot.bad .fb h3{color:var(--bad-ink)}
.fb .ans{font-weight:800}
.fb .exp{font-size:15px}
.fb .perla{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--bronze-d)}
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:10px}
.result h1{font-size:30px;color:var(--bronze)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:16px;border:2px solid var(--sc);overflow:hidden;background:var(--surface)}
.stat .sh{background:var(--sc);color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.stat .sv{font-family:var(--f-display);font-weight:600;font-size:22px;padding:8px 4px;color:var(--sc);display:flex;align-items:center;justify-content:center;gap:4px}
.stat .sv svg{width:20px;height:20px}
.newach{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.introcard{display:flex;flex-direction:column;gap:12px}
.jump{animation:jump .7s ease-out}
@keyframes jump{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}

/* ---------- repaso / logros / progreso ---------- */
.action{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;text-align:left;width:100%}
.action .ai{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.action .ai svg{width:28px;height:28px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.abar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.abar .tr{grid-column:1/3;height:12px;border-radius:7px;background:var(--soft);overflow:hidden}
.abar .tr i{display:block;height:100%;border-radius:7px;background:var(--uc)}
.abar b{font-size:14.5px}
.abar span{font-size:13px;font-weight:800;color:var(--muted)}
.topics{display:flex;flex-direction:column}
.topic{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
.topic:last-child{border-bottom:0}
.st-chip{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.st-ok{background:var(--ok-soft);color:var(--ok-ink)}
.st-mid{background:var(--bronze-soft);color:var(--bronze-d)}
.st-bad{background:var(--bad-soft);color:var(--bad-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{padding:12px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button small{font-weight:700;color:var(--muted);font-size:12px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.sw{width:52px;height:32px;border-radius:16px;background:var(--lock);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .25s ease-out}

/* ---------- bienvenida ---------- */
#onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.onbin{max-width:520px;margin:0 auto;min-height:100%;padding:24px 16px 28px;display:flex;flex-direction:column;gap:18px}
.onbin h1{font-size:30px;line-height:1.15}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  mc('Niña de 6 años, sin fiebre, con mejillas rojas intensas como las del dibujo. Días después aparece un exantema en encaje en brazos y muslos. ¿Agente causal?',['Parvovirus B19','Herpes virus 6','Streptococcus pyogenes','Virus del sarampión'],0,'Es el eritema infeccioso o quinta enfermedad. En embarazadas puede causar hidrops fetal, y en anemia hemolítica crisis aplásica.','cheeks'),
  mc('Lactante de 10 meses con 3 días de fiebre de 39.5 °C y buen estado general. Al quitarse la fiebre le sale un exantema rosado en tronco. ¿Diagnóstico?',['Exantema súbito (roséola) por HHV-6','Sarampión','Rubéola','Enfermedad de Kawasaki'],0,'La clave: el exantema aparece cuando la fiebre desaparece. Puede dar crisis febriles.'),
  mc('Niño de 5 años con fiebre, faringitis y exantema áspero como «papel de lija», lengua en fresa y líneas de Pastia en los pliegues. ¿Tratamiento?',['Penicilina (benzatínica o amoxicilina)','Aciclovir','Solo antipiréticos','Inmunoglobulina IV'],0,'Escarlatina por S. pyogenes. Se trata para prevenir la fiebre reumática.'),
  mc('¿Qué signo del pródromo es patognomónico del sarampión?',['Manchas de Koplik','Adenopatía retroauricular','Lesiones en distintas etapas','Descamación de dedos'],0,'Puntos blancos en la mucosa oral frente a los molares, antes del exantema. El pródromo incluye tos, coriza y conjuntivitis.'),
  mc('Niño de 3 años con fiebre de 6 días, conjuntivitis sin secreción, labios rojos y agrietados, adenopatía cervical y manos hinchadas. ¿Qué complicación preocupa más?',['Aneurismas coronarios','Encefalitis','Glomerulonefritis','Neumonía'],0,'Enfermedad de Kawasaki. Se trata con inmunoglobulina IV y aspirina, y se hace ecocardiograma. Es de las pocas indicaciones de aspirina en niños.'),
  tf('En un niño con varicela se puede dar ácido acetilsalicílico para la fiebre.',false,'Está contraindicado por el riesgo de síndrome de Reye (encefalopatía e insuficiencia hepática). Se usa paracetamol.'),
  mt('Relaciona la pista con el exantema',[['Adenopatía retroauricular','Rubéola'],['Lesiones en distintas etapas («cielo estrellado»)','Varicela'],['Manchas de Koplik','Sarampión'],['Lengua en fresa y líneas de Pastia','Escarlatina']],'Si dominas la pista de cada uno, resuelves casi cualquier caso de exantema.')
 ]},
/* ---------------- GINECOLOGÍA Y OBSTETRICIA ---------------- */
{id:'g1',a:'g',t:'Control prenatal',sub:'Naegele, ácido fólico, fondo uterino, Leopold',dia:'fondo',
 pts:['Naegele: FUM + 7 días − 3 meses + 1 año.','Ácido fólico 0.4 mg/día; 4 mg si hubo defecto del tubo neural.','Fondo uterino: 12 SDG sínfisis · 20 ombligo · 36 xifoides.'],
 qs:[
  mc('Paciente con FUM del 10 de enero de 2026. Según Naegele, ¿cuál es su fecha probable de parto?',['17 de octubre de 2026','3 de octubre de 2026','17 de noviembre de 2026','10 de octubre de 2026'],0,'10 de enero + 7 días = 17 de enero. Menos 3 meses = 17 de octubre. Más 1 año = 2026.'),
  mc('Mujer sana de 27 años que planea embarazarse. ¿Cómo indicas el ácido fólico?',['0.4 mg al día desde al menos 3 meses antes','4 mg al día','5 mg a la semana','Solo desde el segundo trimestre'],0,'El tubo neural se cierra hacia el día 28 de la gestación, muchas veces antes de saber del embarazo. Por eso se inicia antes de concebir.'),
  mc('En la exploración, el fondo uterino llega a la cicatriz umbilical. ¿Cuántas semanas de gestación tiene aproximadamente?',['20','12','28','36'],0,'A las 12 SDG el útero rebasa la sínfisis, a las 20 llega al ombligo y a las 36 al xifoides. Entre las 20 y 34 SDG la altura en cm se parece a las semanas.','fondo'),
  mc('¿Qué identifica la tercera maniobra de Leopold?',['La presentación: qué polo está en la pelvis','Qué polo ocupa el fondo','El lado del dorso fetal','El grado de encajamiento'],0,'La tercera (Pawlik) toma el polo que está sobre la pelvis. La cuarta valora cuánto ha descendido.'),
  tf('Si la paciente tuvo un hijo con defecto del tubo neural, la dosis de ácido fólico sube a 4 mg al día.',true,'También se usan dosis altas con antiepilépticos o diabetes pregestacional, según la guía.'),
  mt('Relaciona cada maniobra de Leopold',[['Primera','Qué polo ocupa el fondo'],['Segunda','Dónde está el dorso'],['Tercera','Presentación'],['Cuarta','Grado de encajamiento']],'Situación, posición, presentación y encajamiento, en ese orden.')
 ]},
{id:'g2',a:'g',t:'Hemorragias del embarazo',sub:'Previa, DPPNI, ectópico, mola, aborto',dia:'placenta',
 pts:['Placenta previa: sangrado rojo, indoloro. Nunca hagas tacto vaginal.','DPPNI: dolor, hipertonía y sangrado oscuro. Su factor de riesgo principal es la hipertensión.','Ectópico: amenorrea, dolor y sangrado. Lo más común es en la ámpula.'],
 qs:[
  mc('Embarazada de 32 SDG con sangrado transvaginal rojo brillante, sin dolor, útero blando y FCF normal. El USG se ve como el esquema. ¿Qué está contraindicado?',['Tacto vaginal','Ultrasonido','Monitorizar la FCF','Hospitalizarla'],0,'Es placenta previa. El tacto puede desencadenar una hemorragia masiva. El USG transvaginal cuidadoso sí está permitido.','previa'),
  mc('Embarazada de 34 SDG con preeclampsia. De pronto tiene dolor abdominal intenso, útero duro y doloroso, sangrado oscuro escaso y bradicardia fetal. ¿Diagnóstico?',['Desprendimiento prematuro de placenta normoinserta','Placenta previa','Rotura uterina','Vasa previa'],0,'El sangrado puede quedar oculto detrás de la placenta (coágulo retroplacentario). Otros factores de riesgo: cocaína, trauma y tabaquismo.'),
  mc('¿Cuál es el sitio más frecuente de embarazo ectópico?',['Ámpula de la trompa','Istmo de la trompa','Ovario','Cérvix'],0,'Más del 90% son tubarios y la mayoría en la ámpula. El factor de riesgo principal es el daño tubario (EPI, cirugía o ectópico previo).'),
  mc('Paciente estable con ectópico no roto de 2.5 cm, hCG de 2,800 mUI/ml y sin latido embrionario. ¿Tratamiento?',['Metotrexato','Salpingectomía urgente','Conducta expectante sin seguimiento','Legrado uterino'],0,'Criterios para metotrexato: estable, masa &lt;3.5 cm, hCG &lt;5,000, sin latido y con seguimiento posible. Si se rompe o está inestable: cirugía.'),
  mc('12 SDG con náuseas y vómito intensos, útero más grande de lo esperado, hCG mayor de 200,000 y USG en «tormenta de nieve», sin embrión. ¿Diagnóstico?',['Mola hidatiforme completa','Embarazo gemelar','Aborto diferido','Embarazo ectópico'],0,'Se trata con aspiración (AMEU) y seguimiento de hCG hasta negativizar. Puede dar preeclampsia antes de las 20 SDG e hipertiroidismo.'),
  mt('Relaciona el cuadro con el tipo de aborto',[['Sangrado, cérvix cerrado, embrión vivo','Amenaza de aborto'],['Cérvix abierto, aún sin expulsión','Aborto inevitable'],['Expulsión parcial con restos','Aborto incompleto'],['Embrión sin vida que no se expulsa','Aborto diferido']],'La clave es el cuello: cerrado (amenaza o diferido) o abierto (inevitable o incompleto).')
 ]},
{id:'g3',a:'g',t:'Preeclampsia',sub:'Diagnóstico, severidad, sulfato de magnesio',dia:'preeclampsia',
 pts:['Después de las 20 SDG: TA &ge;140/90 más proteinuria o datos de daño a órgano.','El edema ya no es criterio.','Si la intoxicación por magnesio abole el reflejo patelar: gluconato de calcio.'],
 qs:[
  mc('Primigesta de 34 SDG con TA de 150/95 en dos tomas separadas, proteinuria de 450 mg en 24 h, sin síntomas y con laboratorios normales. ¿Diagnóstico?',['Preeclampsia sin criterios de severidad','Hipertensión gestacional','Hipertensión crónica','Eclampsia'],0,'La hipertensión gestacional no tiene proteinuria. La crónica aparece antes de las 20 SDG. Eclampsia implica convulsiones.'),
  mc('¿Cuál es el fármaco de elección para prevenir y tratar las convulsiones en preeclampsia con criterios de severidad?',['Sulfato de magnesio','Fenitoína','Diazepam','Nifedipino'],0,'Esquema Zuspan: 4 g IV de impregnación y 1 g/h de mantenimiento.'),
  mc('Paciente con infusión de sulfato de magnesio: reflejo patelar ausente y FR de 10 por minuto. ¿Qué sigue?',['Suspender la infusión y dar gluconato de calcio 1 g IV','Subir la dosis','Agregar fenitoína','Solo observar'],0,'Primero se pierde el reflejo patelar, luego viene la depresión respiratoria y después el paro. Vigila reflejos, FR y diuresis.'),
  mc('¿Cuál de estos es un criterio de severidad en preeclampsia?',['TA de 160/110 o mayor','Proteinuria de 350 mg en 24 h','Edema de tobillos','TA de 142/92'],0,'Otros criterios: plaquetas &lt;100 mil, creatinina &gt;1.1, transaminasas al doble, edema pulmonar, cefalea, fosfenos o epigastralgia.'),
  tf('En mujeres de alto riesgo, la aspirina a dosis baja (100 a 150 mg por la noche) iniciada antes de las 16 SDG reduce el riesgo de preeclampsia.',true,'Se inicia entre las 12 y 16 SDG y se mantiene hasta cerca de las 36.'),
  mt('Relaciona el síndrome HELLP y sus extremos',[['H','Hemólisis'],['EL','Enzimas hepáticas elevadas'],['LP','Plaquetas bajas'],['Convulsiones en una preeclámptica','Eclampsia']],'HELLP es una forma grave: el tratamiento definitivo es interrumpir el embarazo.')
 ]},
{id:'g4',a:'g',t:'Diabetes gestacional e infecciones',sub:'CTOG, bacteriuria y vaginitis',dia:'vaginitis',
 pts:['CTOG 75 g a las 24–28 SDG: ayuno &ge;92, 1 h &ge;180, 2 h &ge;153. Un solo valor diagnostica.','La bacteriuria asintomática en el embarazo siempre se trata.','Tricomonas: se trata también a la pareja.'],
 qs:[
  mc('A las 26 SDG, CTOG de 75 g: ayuno 95, 1 hora 170 y 2 horas 140 mg/dL. ¿Interpretación?',['Diabetes gestacional: basta un valor alterado','Normal','Diabetes tipo 2 pregestacional','Repetir en 4 semanas'],0,'El ayuno de 95 rebasa 92. Las complicaciones fetales son macrosomía e hipoglucemia neonatal.'),
  mc('¿Cuál es el tratamiento inicial de la diabetes gestacional?',['Dieta, ejercicio y automonitoreo de glucosa','Insulina desde el diagnóstico en todos los casos','Glibenclamida','Ayuno intermitente'],0,'Si no se alcanzan metas en 1 a 2 semanas, el fármaco de elección es la insulina.'),
  tf('La bacteriuria asintomática en el embarazo debe tratarse.',true,'Sin tratamiento sube el riesgo de pielonefritis y parto pretérmino. Se hace urocultivo entre las 12 y 16 SDG.'),
  mc('Flujo grisáceo homogéneo con olor a pescado que aumenta al agregar KOH, pH de 5 y células clave en el fresco. ¿Tratamiento?',['Metronidazol','Fluconazol','Clotrimazol','Ceftriaxona'],0,'Vaginosis bacteriana (Gardnerella), con criterios de Amsel. Metronidazol 500 mg cada 12 h por 7 días. No se trata a la pareja.'),
  mc('Flujo verde-amarillo, espumoso, con cérvix en «fresa». ¿Qué indicas?',['Metronidazol a ella y a su pareja','Fluconazol solo a ella','Nada: es normal','Ceftriaxona IM'],0,'Tricomoniasis: es de transmisión sexual, por eso se trata a la pareja.'),
  mt('Relaciona el hallazgo con el diagnóstico',[['Células clave','Vaginosis bacteriana'],['Flujo en «requesón» con pH normal','Candidiasis'],['Cérvix en fresa','Tricomoniasis'],['Macrosomía e hipoglucemia neonatal','Diabetes gestacional']],'En el embarazo, la candidiasis se trata con azoles tópicos (clotrimazol).')
 ]},
{id:'g5',a:'g',t:'Ginecología',sub:'CaCu, SOP, endometriosis, miomas, anticoncepción',
 pts:['CaCu: VPH 16 y 18. Citología de los 25 a 64 años.','SOP (Rotterdam): 2 de 3 criterios.','Endometriosis: el diagnóstico de certeza es por laparoscopia.','La anticoncepción de emergencia más eficaz es el DIU de cobre.'],
 qs:[
  mc('¿Cuál es el principal factor causal del cáncer cervicouterino?',['Infección persistente por VPH de alto riesgo (16 y 18)','Virus herpes simple tipo 2','Chlamydia trachomatis','Uso de anticonceptivos orales'],0,'VPH 16 y 18 causan cerca del 70% de los casos. El tabaquismo y la inmunosupresión son cofactores.'),
  mc('Según la NOM-014, ¿a qué grupo de edad se dirige el tamizaje con citología?',['Mujeres de 25 a 64 años','Desde el inicio de la vida sexual, a cualquier edad','Mujeres de 40 a 69 años','Solo mayores de 50'],0,'La prueba de VPH se usa de los 35 a 64 años. El rango de 40 a 69 corresponde a la mastografía.'),
  mc('Mujer de 24 años con ciclos cada 45 a 60 días, acné e hirsutismo. ¿Qué criterios usas para el síndrome de ovario poliquístico?',['Rotterdam: 2 de 3 (oligoanovulación, hiperandrogenismo, ovarios poliquísticos por USG)','Amsel','Centor','Ámsterdam II'],0,'Antes hay que descartar hiperprolactinemia, hipotiroidismo e hiperplasia suprarrenal. El SOP se asocia a resistencia a la insulina.'),
  mc('Mujer de 30 años con dismenorrea progresiva, dispareunia profunda e infertilidad. ¿Cuál es el estándar de oro para el diagnóstico?',['Laparoscopia con biopsia','Ultrasonido pélvico','CA-125','Resonancia magnética'],0,'Es endometriosis. Los endometriomas son los «quistes de chocolate» del ovario.'),
  mc('¿Cuál es el tumor pélvico benigno más frecuente en la mujer?',['Miomatosis uterina','Quiste dermoide','Endometrioma','Cistadenoma seroso'],0,'Su síntoma más común es el sangrado uterino abundante. Los submucosos son los que más sangran.'),
  mc('Paciente que tuvo relaciones sin protección hace 4 días. ¿Cuál es el método de emergencia más eficaz?',['DIU de cobre','Levonorgestrel 1.5 mg','Condón','Iniciar anticonceptivos orales'],0,'El DIU de cobre funciona hasta 5 días después. El levonorgestrel es mejor dentro de las primeras 72 h.')
 ]},
{id:'g6',a:'g',t:'Parto y puerperio',sub:'Bishop, alumbramiento, hemorragia posparto',dia:'cuatroT',
 pts:['Bishop &lt;6: primero madurar el cuello. &ge;8: cuello favorable.','Manejo activo del alumbramiento: oxitocina 10 UI IM.','Hemorragia posparto: casi siempre es atonía.'],
 qs:[
  mc('¿Cuál es la causa más frecuente de hemorragia posparto?',['Atonía uterina','Desgarros del canal de parto','Restos placentarios','Coagulopatía'],0,'Tono, Trauma, Tejido y Trombina, en ese orden de frecuencia.'),
  mc('Puérpera con hemorragia por atonía. Es hipertensa. ¿Qué uterotónico usas primero?',['Oxitocina','Metilergonovina','Terbutalina','Nifedipino'],0,'La oxitocina es primera línea. La metilergonovina está contraindicada en hipertensión. También se da ácido tranexámico en las primeras 3 horas.'),
  mc('Paciente de 41 SDG con indicación de inducción y Bishop de 4. ¿Qué sigue?',['Madurar el cuello (prostaglandinas o misoprostol)','Oxitocina directa a dosis altas','Cesárea inmediata','Esperar hasta la semana 44'],0,'El Bishop suma dilatación, borramiento, estación, consistencia y posición. Con cuello desfavorable, primero se madura.'),
  mc('¿En qué consiste el manejo activo del tercer periodo del parto?',['Oxitocina 10 UI IM al nacer, tracción controlada del cordón y masaje uterino','Esperar 2 horas a que salga sola la placenta','Tracción fuerte del cordón','Dar oxitocina solo si sangra'],0,'Reduce la hemorragia posparto. El alumbramiento normal dura hasta 30 minutos.'),
  mc('¿Desde qué volumen se define hemorragia posparto en un parto vaginal?',['500 ml o más','250 ml o más','1,000 ml o más','1,500 ml o más'],0,'En cesárea se define con 1,000 ml o más. También cuenta cualquier sangrado que cause inestabilidad.'),
  tf('Los loquios cambian en este orden: rubra, serosa y alba.',true,'Rubra (rojos, días 1 a 3), serosa (rosados, hasta el día 10) y alba (blanquecinos). Si huelen mal, piensa en endometritis.'),
  mt('Relaciona cada «T» con su causa',[['Tono','Atonía uterina'],['Trauma','Desgarros o rotura uterina'],['Tejido','Restos placentarios'],['Trombina','Coagulopatía']],'Ante una hemorragia posparto: masaje, oxitocina y revisión del canal y la cavidad.')
 ]},
/* ---------------- MEDICINA FAMILIAR ---------------- */
{id:'m1',a:'m',t:'Diabetes tipo 2',sub:'Diagnóstico, metformina y metas',dia:'dxdm',
 pts:['Sin síntomas, el diagnóstico se confirma con dos pruebas alteradas.','La metformina es la primera línea si no hay contraindicación.','Meta general de HbA1c: menor de 7%.'],
 qs:[
  mc('Hombre de 45 años, asintomático, con glucosa en ayuno de 132 mg/dL y luego 135 mg/dL en otra muestra. ¿Diagnóstico?',['Diabetes tipo 2','Prediabetes','Normal','Repetir en un año'],0,'Dos determinaciones en ayuno de 126 o más confirman el diagnóstico.'),
  mc('Paciente con HbA1c de 6.1%. ¿Cómo la clasificas?',['Prediabetes','Diabetes tipo 2','Normal','Hipoglucemia'],0,'La prediabetes por HbA1c va de 5.7 a 6.4%. Se maneja con cambios en el estilo de vida, y en algunos casos metformina.'),
  mc('¿Cuál es el fármaco de primera línea en diabetes tipo 2 sin contraindicaciones?',['Metformina','Insulina NPH','Glibenclamida','Pioglitazona'],0,'Está contraindicada con TFG menor de 30. Hay que ajustarla entre 30 y 45.'),
  mc('¿Qué debes vigilar en un paciente que toma metformina por años?',['Deficiencia de vitamina B12','Hipoglucemia frecuente en monoterapia','Aumento de peso','Hiperkalemia'],0,'La metformina sola casi no causa hipoglucemia y es neutra o reduce el peso. La acidosis láctica es rara.'),
  mc('¿Cuál es la meta general de HbA1c en un adulto con diabetes?',['Menor de 7%','Menor de 5%','Menor de 9%','No hay meta'],0,'En adultos mayores frágiles se permite una meta menos estricta, de 7.5 a 8%.'),
  tf('Una glucosa al azar de 200 mg/dL o más, con poliuria, polidipsia y pérdida de peso, confirma diabetes.',true,'Con síntomas clásicos basta un solo valor. Sin síntomas se necesitan dos pruebas alteradas.')
 ]},
{id:'m2',a:'m',t:'Hipertensión y riesgo cardiovascular',sub:'Antihipertensivos, obesidad y lípidos',dia:'farmacos',
 pts:['HTA: 140/90 o más, en dos o más visitas (NOM-030).','Si hay diabetes o proteinuria: IECA o ARA II.','Tos por IECA: cambia a ARA II.','Obesidad abdominal (NOM-008): mujer &ge;80 cm, hombre &ge;90 cm.'],
 qs:[
  mc('Mujer de 52 años con diabetes tipo 2, microalbuminuria y TA sostenida de 148/92. ¿Qué antihipertensivo inicias?',['IECA o ARA II','Betabloqueador','Diurético de asa','Hidralazina'],0,'Protegen el riñón al disminuir la presión intraglomerular. Vigila potasio y creatinina.'),
  mc('Paciente que toma enalapril y tiene tos seca persistente. ¿Qué haces?',['Cambiar a un ARA II como losartán','Agregar un antitusivo','Subir la dosis','Cambiar a otro IECA'],0,'La tos se debe a la acumulación de bradicinina y es efecto de toda la clase. Los ARA II no la producen.'),
  mc('Mujer hipertensa de 28 años que toma losartán y quiere embarazarse. ¿Qué haces?',['Cambiar el fármaco antes de embarazarse: IECA y ARA II son teratogénicos','Mantenerlo: es seguro','Cambiar a enalapril','Suspender todo antihipertensivo'],0,'En el embarazo se usan metildopa, labetalol o nifedipino.'),
  mt('Relaciona el fármaco con su efecto adverso',[['Amlodipino','Edema maleolar'],['Hidroclorotiazida','Hipokalemia e hiperuricemia'],['Enalapril','Tos seca y angioedema'],['Atorvastatina','Mialgias y CPK elevada']],'Son las asociaciones más preguntadas del primer nivel.'),
  mc('¿Desde qué índice de masa corporal se diagnostica obesidad en adultos?',['30 o más','25 o más','27 o más','35 o más'],0,'Sobrepeso: 25 a 29.9. Obesidad grado I: 30 a 34.9, grado II: 35 a 39.9 y grado III: 40 o más.'),
  mc('Según la NOM-008, ¿desde qué circunferencia de cintura hay obesidad abdominal en una mujer?',['80 cm o más','88 cm o más','102 cm o más','94 cm o más'],0,'En hombres es de 90 cm o más. Los valores de 88 y 102 son del ATP III, no de la norma mexicana.')
 ]},
{id:'m3',a:'m',t:'Familia',sub:'Familiograma, Geyman y APGAR familiar',dia:'geyman',
 pts:['El APGAR familiar mide cómo percibe el paciente la función de su familia.','El familiograma abarca al menos 3 generaciones.','Geyman: matrimonio, expansión, dispersión, independencia, retiro y muerte.'],
 qs:[
  mc('¿Qué evalúa el APGAR familiar de Smilkstein?',['La percepción del paciente sobre la funcionalidad de su familia','La adaptación del recién nacido','La estructura familiar','El nivel socioeconómico'],0,'Evalúa Adaptación, Participación, Gradiente de crecimiento, Afecto y Resolución. No lo confundas con el APGAR neonatal.'),
  mc('¿Qué fase del ciclo vital de Geyman inicia con el nacimiento del primer hijo?',['Expansión','Matrimonio','Dispersión','Independencia'],0,'Matrimonio va de la unión al primer hijo. Expansión es la llegada de los hijos.'),
  mc('¿Cuántas generaciones debe incluir como mínimo un familiograma?',['Tres','Una','Dos','Cinco'],0,'Así se ven patrones heredofamiliares y relacionales: abuelos, padres e hijos.'),
  tf('En el familiograma, el cuadrado representa a un hombre y el círculo a una mujer.',true,'El paciente índice se marca con doble línea o una flecha. Un aborto se representa con un triángulo pequeño o un punto, según la convención.'),
  mt('Relaciona cada fase de Geyman',[['Matrimonio','La pareja, aún sin hijos'],['Expansión','Llegada de los hijos'],['Dispersión','Hijos en edad escolar y adolescencia'],['Independencia','Los hijos forman su propia familia']],'La quinta fase es retiro y muerte.'),
  mc('En la versión de 0 a 10 puntos del APGAR familiar, un paciente obtiene 5. ¿Cómo lo interpretas?',['Disfunción familiar moderada','Familia funcional','Disfunción severa','No es interpretable'],0,'7 a 10: funcional · 4 a 6: disfunción moderada · 0 a 3: disfunción severa.')
 ]},
{id:'m4',a:'m',t:'Prevención y tamizaje',sub:'Niveles de prevención y normas',dia:'prevencion',
 pts:['Primaria: evitar la enfermedad. Secundaria: detectarla temprano. Terciaria: limitar secuelas.','Mastografía de los 40 a 69 años, cada 2 años (NOM-041).','La prevención cuaternaria evita la sobremedicalización.'],
 qs:[
  mc('Vacunar contra influenza a una persona sana es prevención…',['Primaria','Secundaria','Terciaria','Cuaternaria'],0,'Actúa antes de que exista la enfermedad.'),
  mc('Hacer una mastografía de tamizaje a una mujer sana de 45 años es prevención…',['Secundaria','Primaria','Terciaria','Cuaternaria'],0,'Busca la enfermedad en etapa temprana, antes de los síntomas.'),
  mc('La rehabilitación de un paciente después de un EVC es prevención…',['Terciaria','Primaria','Secundaria','Cuaternaria'],0,'Limita secuelas y discapacidad cuando la enfermedad ya ocurrió.'),
  mc('Según la NOM-041, ¿cómo se hace el tamizaje con mastografía?',['De los 40 a los 69 años, cada 2 años','Desde los 20 años, cada año','Solo a partir de los 60','De los 25 a 64 años, cada 3 años'],0,'Autoexploración desde los 20 años y exploración clínica anual desde los 25.'),
  tf('La prevención cuaternaria busca evitar la sobremedicalización y el daño por intervenciones innecesarias.',true,'Por ejemplo, no pedir estudios sin indicación o no tratar cifras sin beneficio clínico.'),

/* fechas locales */
function dk(d){const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function pd(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function addDays(k,n){const d=pd(k);d.setDate(d.getDate()+n);return dk(d)}
const today=()=>dk();
function dayNum(){return Math.floor(pd(today())/864e5)}

function ensureDaily(){if(S.daily.d!==today())S.daily=freshDaily(today())}
function checkStreak(){
  if(!S.last)return null;
  const gap=diffDays(S.last,today());
  if(gap<=1)return null;
  const missed=gap-1;
  if(S.streak>0&&S.freezes>=missed){S.freezes-=missed;S.last=addDays(today(),-1);return 'froze'}
  if(S.streak>0){const lost=S.streak;S.streak=0;return 'lost:'+lost}
  return null;
}

function qstat(id){return S.Q[id]||[0,0]}
function lessonAcc(L){let s=0,c=0;L.qs.forEach(q=>{const [a,b]=qstat(q.id);s+=a;c+=b});return {seen:s,ok:c,acc:s?Math.round(c*100/s):null}}
function areaAcc(a){let s=0,c=0;LESSONS.filter(L=>L.a===a).forEach(L=>{const r=lessonAcc(L);s+=r.seen;c+=r.ok});return {seen:s,ok:c,acc:s?Math.round(c*100/s):null}}
function nextIn(a){return LESSONS.find(L=>L.a===a&&!S.L[L.id])}
function areaOrder(){return S.focus==='g'?['g','p','m']:S.focus==='p'?['p','m','g']:['p','g','m']}

function ideas(){
  const out=[];
  if(S.err.length>=3)out.push({ic:'repeat',tx:`Tienes ${S.err.length} preguntas falladas guardadas. Repasarlas hoy es lo que más te va a rendir.`,btn:'Repasar errores',act:'review'});
  let weak=null;
  LESSONS.forEach(L=>{const r=lessonAcc(L);if(r.seen>=4&&r.acc<70&&(!weak||r.acc<weak.acc))weak={L,acc:r.acc}});
  if(weak)out.push({ic:'target',tx:`Refuerza <b>${weak.L.t}</b>: vas en ${weak.acc}%. Lee la ficha y repite la lección.`,btn:'Repetir lección',act:'lesson:'+weak.L.id});
  const cands=areaOrder().map(a=>nextIn(a)).filter(Boolean);
  if(cands.length){
    cands.sort((x,y)=>unitDone(x.a)-unitDone(y.a)||areaOrder().indexOf(x.a)-areaOrder().indexOf(y.a));
    const L=cands[0];
    out.push({ic:AREAS[L.a].icon,tx:`Siguiente en tu ruta: <b>${AREAS[L.a].short} · ${L.t}</b>. ${L.a==='g'?'Va directo a tu posible especialidad.':'Es de tus áreas a reforzar.'}`,btn:'Empezar',act:'lesson:'+L.id});
  }else out.push({ic:'quiz',tx:'Ya terminaste toda la ruta. Mide cómo vas con un mini-simulacro de 15 casos.',btn:'Mini-simulacro',act:'sim'});
  if(S.exam){const left=diffDays(today(),S.exam);if(left>0)out.push({ic:'clock',tx:`Faltan <b>${left} días</b> para tu ENARM. Con tu meta de ${S.goal} XP diarios son unas ${Math.round(left*S.goal/20)} lecciones de práctica.`})}
  out.push({ic:'bulb',tx:TIPS[dayNum()%TIPS.length]});
  return out;
}

function tone(ok){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.1+.22);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.1);o.stop(AC.currentTime+i*.1+.25)});
  }catch(e){}
}

     <div class="quests"><div class="eyebrow">Misiones de hoy</div>${qs}</div></div>
   <div class="card"><div class="eyebrow" style="margin-bottom:12px">Te propongo</div><div class="ideas">
     ${top.map(x=>`<div class="idea"><div class="ico">${I[x.ic]}</div><div class="tx"><p>${x.tx}</p><button class="btn sm" data-act="${x.act}">${x.btn}</button></div></div>`).join('')}
     ${tip?`<div class="idea"><div class="ico">${I.bulb}</div><div class="tx"><p class="small">${tip.tx}</p></div></div>`:''}
   </div></div>`;
  const offs=[0,44,64,44,0,-44,-64,-44];

    const A=AREAS[a];const ls=LESSONS.filter(L=>L.a===a);const cur=nextIn(a);
    html+=`<div style="${uvars(a)}"><div class="unit" style="background:var(--uc)"><div class="uicon">${I[A.icon]}</div><div style="min-width:0"><p>${A.tag} · ${unitDone(a)}/${ls.length}</p><h2>${A.name}</h2></div><button class="ub" data-act="tab:repaso">Fichas</button></div>
      <div class="path">${ls.map((L,i)=>{
        const done=!!S.L[L.id];const isCur=cur&&cur.id===L.id;const st=done?'done':isCur?'cur':'lock';

  });
  html+=`<p class="note" style="text-align:center">Complemento de estudio basado en GPC y NOM mexicanas. Ante cualquier duda, la guía vigente manda.</p></div>`;

/* ---------- PROGRESO ---------- */
function viewProgreso(){
  let seen=0,ok=0;Object.values(S.Q).forEach(([a,b])=>{seen+=a;ok+=b});
  const acc=seen?Math.round(ok*100/seen):0;
  const days=[];for(let i=6;i>=0;i--){const k=addDays(today(),-i);days.push([k,S.days[k]||0])}
  const mx=Math.max(S.goal,...days.map(d=>d[1]))*1.15;
  const W=320,H=170,bw=30,gap=(W-20-7*bw)/6,base=140;
  const yOf=v=>base-(v/mx)*110;
  const wd=['D','L','M','M','J','V','S'];
  const bars=days.map(([k,v],i)=>{const x=10+i*(bw+gap);const y=yOf(v);const isT=k===today();
    return `<rect x="${x}" y="${v?y:base-3}" width="${bw}" height="${v?base-y:3}" rx="7" style="fill:${v>=S.goal?'var(--ok)':isT?'var(--accent)':'var(--u-p-soft)'}"/>${v?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" style="fill:var(--ink)">${v}</text>`:''}<text x="${x+bw/2}" y="${base+18}" text-anchor="middle" font-size="12" style="fill:${isT?'var(--accent)':'var(--muted)'}">${wd[pd(k).getDay()]}</text>`}).join('');
  const gy=yOf(S.goal);
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="XP de los últimos 7 días"><line x1="4" x2="${W-4}" y1="${base}" y2="${base}" style="stroke:var(--line)" stroke-width="1.5"/><line x1="4" x2="${W-4}" y1="${gy}" y2="${gy}" style="stroke:var(--bronze)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-4}" y="${gy-5}" text-anchor="end" font-size="11" style="fill:var(--bronze-d)">meta ${S.goal}</text>${bars}</svg>`;
  const areas=['p','g','m'].map(a=>{const r=areaAcc(a);return `<div class="abar" style="${uvars(a)}"><b>${AREAS[a].name}</b><span class="num">${r.acc===null?'sin datos':r.acc+'% · '+r.seen+' resp.'}</span><div class="tr"><i style="width:${r.acc||0}%"></i></div></div>`}).join('');
  const tops=LESSONS.map(L=>({L,r:lessonAcc(L)})).filter(x=>x.r.seen).sort((a,b)=>a.r.acc-b.r.acc);
  const chip=acc=>acc>=80?'<span class="st-chip st-ok">Fuerte</span>':acc>=60?'<span class="st-chip st-mid">En progreso</span>':'<span class="st-chip st-bad">Reforzar</span>';
  const id=ideas();
  return `<div class="stack"><h1 class="h-sec">Tu desempeño</h1>
   <div class="kpis"><div class="kpi"><b class="num" style="color:#e8792b">${S.streak}</b><span>Días de racha · mejor ${S.best}</span></div>
   <div class="kpi"><b class="num" style="color:var(--accent)">${S.xp}</b><span>XP en total</span></div>
   <div class="kpi"><b class="num" style="color:var(--ok)">${seen?acc+'%':'—'}</b><span>Acierto a la primera</span></div>
   <div class="kpi"><b class="num" style="color:var(--bronze)">${seen}</b><span>Preguntas respondidas</span></div></div>
   <div class="card"><div class="eyebrow">Últimos 7 días</div>${chart}</div>
   <div class="card stack"><div class="eyebrow">Por área</div>${areas}</div>
   <div class="card"><div class="eyebrow">Por tema · de más débil a más fuerte</div>
   ${tops.length?`<div class="topics">${tops.map(x=>`<button class="topic" data-act="node:${x.L.id}" style="text-align:left"><span>${x.L.t}<br><span class="small muted">${AREAS[x.L.a].short}</span></span><span class="num muted">${x.r.acc}%</span>${chip(x.r.acc)}</button>`).join('')}</div>`:'<p class="muted small" style="margin-top:8px">Termina tu primera lección y aquí verás qué temas dominas y cuáles reforzar.</p>'}</div>
   <div class="card"><div class="eyebrow" style="margin-bottom:12px">Lo que te propongo</div><div class="ideas">${id.map(x=>`<div class="idea"><div class="ico">${I[x.ic]}</div><div class="tx"><p class="small">${x.tx}</p>${x.btn?`<button class="btn sm" data-act="${x.act}">${x.btn}</button>`:''}</div></div>`).join('')}</div></div>
  </div>`;
}

function bindPerfil(){
  $('#fName').onchange=e=>{S.name=e.target.value.trim()||'Fanny';save();renderTop()};
  $('#segGoal').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.goal=+b.dataset.v;save();render()};
  $('#segFocus').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.focus=b.dataset.v;save();render()};
  $('#fExam').onchange=e=>{S.exam=e.target.value;save()};
  $('#swSound').onclick=()=>{S.sound=!S.sound;save();render()};
  $('#bCopy').onclick=()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ta=$('#fRestore');
    const fallback=()=>{ta.value=code;ta.focus();ta.select();toast('Código listo: cópialo del recuadro')};
    try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado. Guárdalo en Notas.'),fallback)}catch(e){fallback()}
  };
  $('#bRestore').onclick=()=>{
    const v=$('#fRestore').value.trim();if(!v){toast('Pega primero tu código');return}
    try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||o.v!==1||typeof o.xp!=='number')throw 0;
      S=Object.assign(fresh(),o);S.st=Object.assign(fresh().st,o.st||{});save();render();toast('Progreso restaurado')}
    catch(e){toast('Ese código no es válido. Revisa que esté completo.')}
  };
  $('#bReset').onclick=()=>{
    openSheet(`<h2 style="font-size:22px">¿Reiniciar todo?</h2><p class="muted">Se borran tu XP, racha, logros y estadísticas de este teléfono. No se puede deshacer.</p><div class="btnrow"><button class="btn bad" id="bReset2">Sí, reiniciar</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);
    $('#bReset2').onclick=()=>{const keep={name:S.name,goal:S.goal,focus:S.focus,exam:S.exam,sound:S.sound,onb:true};S=Object.assign(fresh(),keep);S.daily=freshDaily(today());save();closeSheet();render();toast('Progreso reiniciado')};
  };
}

/* =========================================================
   SESIÓN DE ESTUDIO
   ========================================================= */
let R=null;
function startLesson(id){
  closeSheet();const L=LMAP[id];
  R={mode:'lesson',L,queue:shuffle(L.qs).map(q=>({q,retry:false})),phase:'intro'};
  initR();showLesson();
}
function startReview(){
  closeSheet();
  if(!S.err.length){openSheet(`<div class="row">${tris('happy','')}</div><h2 style="font-size:22px">No tienes errores guardados</h2><p class="muted">Cuando falles una pregunta, llega aquí sola para que la vuelvas a intentar.</p><button class="btn" data-act="mix">Hacer un repaso rápido</button>`);$('#sheet .row svg').style.width='90px';return}
  R={mode:'review',queue:shuffle(S.err).slice(0,8).map(id=>({q:QMAP[id],retry:false})).filter(x=>x.q),phase:'q'};
  initR();showLesson();
}
function startMix(){
  closeSheet();
  let pool=LESSONS.filter(L=>S.L[L.id]).flatMap(L=>L.qs);
  if(pool.length<10)pool=LESSONS.flatMap(L=>L.qs);
  R={mode:'mix',queue:shuffle(pool).slice(0,10).map(q=>({q,retry:false})),phase:'q'};
  initR();showLesson();
}
function startSim(){
  closeSheet();
  const pool=LESSONS.flatMap(L=>L.qs).filter(q=>q.t==='mc');
  R={mode:'sim',queue:shuffle(pool).slice(0,15).map(q=>({q,retry:true})),phase:'q'};
  initR();showLesson();
}
function initR(){Object.assign(R,{pos:0,total:R.queue.length,done:0,first:0,firstOk:0,wrongIds:new Set(),seenIds:new Set(),combo:0,maxCombo:0,xp:0,t0:Date.now(),sel:null,checked:false})}

function showLesson(){$('#lesson').hidden=false;document.body.style.overflow='hidden';drawLesson()}
function hideLesson(){$('#lesson').hidden=true;document.body.style.overflow='';R=null;render()}

function drawLesson(){
  const el=$('#lesson');
  if(R.phase==='intro'){
    el.innerHTML=`<div class="lhead"><button class="x" id="lx" aria-label="Salir">${I.x}</button><div class="prog"><i style="width:0%"></i></div><span class="combo"></span></div>
     <div class="lbody"><div class="lbodyin introcard">${fichaHtml(R.L)}<div class="row" style="gap:8px">${tris('think','')}<p class="bubble small">Lee la ficha con calma. Después vienen ${R.total} casos.</p></div></div></div>
     <div class="lfoot"><div class="lfootin"><button class="btn" id="lgo">Empezar</button></div></div>`;
    el.querySelector('.row svg').style.cssText='width:70px;flex:none';
    $('#lx').onclick=hideLesson;$('#lgo').onclick=()=>{R.phase='q';R.t0=Date.now();drawLesson()};
    return;
  }
  if(R.phase==='end'){drawEnd();return}
  const it=R.queue[R.pos];const q=it.q;
  if(!it.opts){it.opts=q.t==='mc'?shuffle(q.o.map((_,i)=>i)):q.t==='tf'?[0,1]:null;if(q.t==='mt'){it.right=shuffle(q.pairs.map((_,i)=>i));it.matched=new Set();it.selL=null;it.bad=false}}
  R.sel=null;R.checked=false;
  const A=AREAS[q.ar];
  const kind=q.t==='mc'?(q.q.length>110?'Caso clínico':'Pregunta'):q.t==='tf'?'Verdadero o falso':'Relaciona';
  let body=`<div class="qtype"><span class="chip" style="${uvars(q.ar)};background:var(--ucs);color:var(--uc)">${A.short}</span><span class="eyebrow">${kind}${it.retry&&R.mode!=='sim'?' · otra vez':''}</span></div>`;
  if(q.img)body+=`<div class="dia">${QIMG[q.img]()}</div>`;
  body+=`<p class="qtext">${q.q}</p>`;
  if(q.t==='mc')body+=`<div class="opts">${it.opts.map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="k">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`).join('')}</div>`;
  if(q.t==='tf')body+=`<div class="tfrow"><button class="opt" data-o="0"><span>Verdadero</span></button><button class="opt" data-o="1"><span>Falso</span></button></div>`;
  if(q.t==='mt')body+=`<div class="match"><div class="col">${q.pairs.map((p,i)=>`<button class="tile" data-l="${i}">${p[0]}</button>`).join('')}</div><div class="col">${it.right.map(i=>`<button class="tile" data-r="${i}">${q.pairs[i][1]}</button>`).join('')}</div></div>`;
  el.innerHTML=`<div class="lhead"><button class="x" id="lx" aria-label="Salir">${I.x}</button><div class="prog"><i style="width:${R.done*100/R.total}%"></i></div><span class="combo">${R.combo>=3?I.flame+'<span class="num">'+R.combo+'</span>':''}</span></div>
   <div class="lbody" id="lbody"><div class="lbodyin">${body}</div></div>
   <div class="lfoot" id="lfoot"><div class="lfootin">${q.t==='mt'?'<p class="note" style="text-align:center">Toca un concepto de la izquierda y luego su pareja.</p>':'<button class="btn" id="lchk" disabled>Comprobar</button>'}</div></div>`;
  $('#lx').onclick=quitAsk;
  if(q.t!=='mt'){
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(R.checked)return;el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');R.sel=+b.dataset.o;$('#lchk').disabled=false});
    $('#lchk').onclick=()=>{if(R.sel===null)return;const correct=q.t==='mc'?R.sel===q.a:(R.sel===0)===q.a;answer(correct)};
  }else{
    el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>matchTap(b,it,q));
  }
}
function matchTap(b,it,q){
  if(R.checked)return;
  const el=$('#lesson');
  if(b.dataset.l!==undefined){const i=+b.dataset.l;if(it.matched.has(i))return;it.selL=i;el.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('sel',x===b));return}
  const j=+b.dataset.r;if(it.matched.has(j)||it.selL===null)return;
  const lb=el.querySelector(`[data-l="${it.selL}"]`);
  if(j===it.selL){it.matched.add(j);lb.className='tile ok';b.className='tile ok';lb.disabled=true;b.disabled=true;it.selL=null;tone(true);
    if(it.matched.size===q.pairs.length)answer(!it.bad);}
  else{it.bad=true;b.classList.add('no');lb.classList.add('no');tone(false);setTimeout(()=>{b.classList.remove('no');lb.classList.remove('no')},400)}
}
function answer(correct){
  R.checked=true;const it=R.queue[R.pos];const q=it.q;
  const firstTime=!R.seenIds.has(q.id);
  if(firstTime){
    R.seenIds.add(q.id);R.first++;
    const s=qstat(q.id);S.Q[q.id]=[s[0]+1,s[1]+(correct?1:0)];
    S.daily[q.ar]=(S.daily[q.ar]||0)+1;
    if(correct)R.firstOk++;else R.wrongIds.add(q.id);
  }
  if(correct){
    R.done++;R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);R.xp+=2;
    const ix=S.err.indexOf(q.id);
    if(ix>=0&&R.mode==='review'){S.err.splice(ix,1);S.daily.review++;S.st.reviewFixed++}
  }else{
    R.combo=0;
    if(!S.err.includes(q.id))S.err.push(q.id);
    if(!it.retry){R.queue.push({q,retry:true})}else R.done++;
  }
  if(R.mode!=='sim')tone(correct);
  // marcar opciones
  const el=$('#lesson');
  if(q.t!=='mt'){
    const rightIdx=q.t==='mc'?q.a:(q.a?0:1);
    el.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(R.mode==='sim'){return}
      if(o===rightIdx)b.classList.add('right');else if(o===R.sel)b.classList.add('wrong')});
  }
  el.querySelector('.prog i').style.width=(R.done*100/R.total)+'%';
  el.querySelector('.combo').innerHTML=R.combo>=3?I.flame+'<span class="num">'+R.combo+'</span>':'';
  const foot=$('#lfoot');
  if(R.mode==='sim'){foot.innerHTML=`<div class="lfootin"><button class="btn" id="lnext">Siguiente</button></div>`;$('#lnext').onclick=next;return}
  const praise=['¡Bien, doctora!','¡Exacto!','¡Así se hace!','¡Impecable!','¡Diagnóstico correcto!'];
  const ans=q.t==='mc'?q.o[q.a]:q.t==='tf'?(q.a?'Verdadero':'Falso'):'';
  foot.className='lfoot '+(correct?'ok':'bad');
  foot.innerHTML=`<div class="lfootin"><div class="fb"><h3>${correct?I.check:I.x}${correct?praise[Math.floor(Math.random()*praise.length)]:(q.t==='mt'?'Casi: hubo pares cruzados':'Respuesta correcta:')}</h3>
   ${!correct&&ans?`<p class="ans">${ans}</p>`:''}
   <p class="perla">Perla ENARM</p><p class="exp">${q.e}</p>${!correct&&!it.retry?'<p class="small" style="font-weight:800">Te la vuelvo a preguntar al final y ya quedó en tu Repaso.</p>':''}</div>
   <button class="btn ${correct?'ok':'bad'}" id="lnext">Continuar</button></div>`;
  $('#lnext').onclick=next;
}
function next(){R.pos++;if(R.pos>=R.queue.length){R.phase='end';finish()}else drawLesson();$('#lbody')&&($('#lbody').scrollTop=0)}
function quitAsk(){
  openSheet(`<div class="row">${tris('sad','')}</div><h2 style="font-size:22px">¿Segura que quieres salir?</h2><p class="muted">Si sales ahora pierdes el XP de esta sesión. Lo que ya respondiste sí cuenta para tus estadísticas.</p>
   <div class="btnrow"><button class="btn" data-act="close">Seguir estudiando</button><button class="btn ghost" id="bQuit" style="color:var(--bad)">Salir</button></div>`);
  $('#sheet .row svg').style.width='90px';
  $('#bQuit').onclick=()=>{save();closeSheet();hideLesson()};
}
function finish(){
  const acc=R.first?Math.round(R.firstOk*100/R.first):0;
  const perfect=R.wrongIds.size===0&&R.first>0;
  let xp=R.xp+5+(perfect&&R.mode==='lesson'?5:0);
  let gems=5+(perfect?5:0);
  const t=today();
  S.xp+=xp;S.days[t]=(S.days[t]||0)+xp;S.daily.xp+=xp;S.gems+=gems;
  S.daily.combo=Math.max(S.daily.combo,R.maxCombo);S.st.maxCombo=Math.max(S.st.maxCombo,R.maxCombo);
  if(R.mode==='lesson'){
    S.daily.lessons++;S.st.lessons++;
    if(perfect){S.daily.perfect++;S.st.perfect++}
    const prev=S.L[R.L.id]||{n:0,best:0};S.L[R.L.id]={n:prev.n+1,best:Math.max(prev.best,acc)};
  }
  if(R.mode==='sim')S.st.simBest=Math.max(S.st.simBest,acc);
  const h=new Date().getHours();if(h>=23)S.st.owl=1;if(h<7)S.st.early=1;
  // racha
  let streakUp=false;
  if(S.last!==t){S.streak=(S.last&&diffDays(S.last,t)===1)?S.streak+1:1;S.last=t;S.best=Math.max(S.best,S.streak);streakUp=true}
  const qmsgs=award();const newA=checkAch();
  save();
  R.res={acc,perfect,xp,gems,streakUp,qmsgs,newA,secs:Math.round((Date.now()-R.t0)/1000)};
  drawEnd();
}
function drawEnd(){
  const r=R.res;const el=$('#lesson');
  const mm=Math.floor(r.secs/60),ss=String(r.secs%60).padStart(2,'0');
  const title=R.mode==='sim'?(r.acc>=80?'¡Simulacro superado!':'Simulacro terminado'):r.perfect?'¡Lección perfecta!':'¡Sesión terminada!';
  const sub=R.mode==='sim'?`${R.firstOk} de ${R.first} correctas. ${r.acc>=80?'Así se ve una residente.':'Las que fallaste ya están en tu Repaso.'}`:r.perfect?'Ni un solo error. Tris está orgullosa.':`Acertaste ${R.firstOk} de ${R.first} a la primera. Lo que fallaste quedó en tu Repaso.`;
  let simList='';
  if(R.mode==='sim'){simList=`<div class="card" style="width:100%;text-align:left"><div class="eyebrow" style="margin-bottom:8px">Para revisar</div>${R.queue.filter(x=>R.wrongIds.has(x.q.id)).map(x=>`<p class="small" style="margin-bottom:10px"><b>${x.q.o[x.q.a]}</b> · ${x.q.e}</p>`).join('')||'<p class="small">Sin errores. Excelente.</p>'}</div>`}
  el.innerHTML=`<div class="lbody"><div class="lbodyin result">
    <div class="jump" style="width:130px">${tris('happy','')}</div>
    <h1>${title}</h1><p class="muted" style="max-width:34ch">${sub}</p>
    <div class="tiles3">
     <div class="stat" style="--sc:var(--sun-d)"><div class="sh">XP ganado</div><div class="sv num">${I.bolt}${r.xp}</div></div>
     <div class="stat" style="--sc:var(--ok)"><div class="sh">Acierto</div><div class="sv num">${r.acc}%</div></div>
     <div class="stat" style="--sc:var(--accent)"><div class="sh">Tiempo</div><div class="sv num">${mm}:${ss}</div></div></div>
    <div class="card row" style="width:100%;text-align:left"><span style="width:36px;flex:none">${sunflower()}</span><div style="flex:1;min-width:0"><b>+${r.gems} girasoles</b>${r.streakUp?`<p class="small muted">Racha: <b style="color:#e8792b">${S.streak} ${S.streak===1?'día':'días'}</b>. Vuelve mañana para mantenerla.</p>`:''}</div></div>
    ${r.qmsgs.map(m=>`<div class="card" style="width:100%;text-align:left;border-color:var(--ok)"><p class="small" style="font-weight:800;color:var(--ok-ink)">${m}</p></div>`).join('')}
    ${r.newA.length?`<div class="newach"><div class="eyebrow" style="text-align:center">Logro nuevo</div>${r.newA.map(A=>`<div class="card row">${medal(A,true)}<div style="min-width:0"><b>${A.n}</b><p class="small muted">${A.d} · +15 girasoles</p></div></div>`).join('')}</div>`:''}
    ${simList}
  </div></div>
  <div class="lfoot"><div class="lfootin"><button class="btn" id="ldone">Continuar</button></div></div>`;
  el.querySelectorAll('.newach .med').forEach(m=>m.style.cssText='width:54px;height:54px;flex:none');
  el.querySelector('.card.row svg').style.cssText='width:34px;height:34px';
  $('#ldone').onclick=hideLesson;
  tone(true);
}

/* =========================================================
   BIENVENIDA
   ========================================================= */
let OB={step:0,name:'Fanny',goal:30,focus:'both',exam:''};
function drawOnb(){
  const o=$('#onb');o.hidden=false;
  const dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===OB.step?'on':''}"></i>`).join('')}</div>`;
  let c='';
  if(OB.step===0)c=`<div style="width:150px;align-self:center" class="jump">${tris('happy','')}</div>
    <h1>Hola, soy Tris. Vamos juntas por el ENARM.</h1>
    <p class="muted">Casos clínicos cortos todos los días, con énfasis en Pediatría, Ginecología y Obstetricia y Medicina Familiar. Pensada para usarse junto con tu curso en línea.</p>
    <div class="field"><label for="oName">¿Cómo te llamo?</label><input id="oName" value="${OB.name}" maxlength="24" autocomplete="off"></div>`;
  if(OB.step===1)c=`<h1>¿Cuál es tu meta diaria?</h1><p class="muted">Cada lección da unos 15 a 20 XP. Puedes cambiarla cuando quieras.</p>
    <div class="seg" id="oGoal" style="grid-template-columns:1fr">${GOALS.map(([v,l,s])=>`<button data-v="${v}" class="${OB.goal===v?'on':''}">${l} · ${v} XP al día<small>${s}</small></button>`).join('')}</div>`;
  if(OB.step===2)c=`<h1>¿Hacia dónde vas?</h1><p class="muted">Pediatría y Medicina Familiar llevan refuerzo extra en tus misiones, porque son las que más te cuestan.</p>
    <div class="seg" id="oFocus" style="grid-template-columns:1fr">${FOCUS.map(([v,l])=>`<button data-v="${v}" class="${OB.focus===v?'on':''}">${l}</button>`).join('')}</div>`;
  if(OB.step===3)c=`<h1>¿Ya tienes fecha de examen?</h1><p class="muted">Es opcional. Si la pones, verás la cuenta regresiva y un cálculo de cuánto puedes practicar.</p>
    <div class="field"><label for="oExam">Fecha del ENARM</label><input id="oExam" type="date" value="${OB.exam}"></div>`;
  o.innerHTML=`<div class="onbin">${dots}${c}<div style="flex:1"></div><div class="btnrow"><button class="btn" id="oNext">${OB.step===3?'Empezar a estudiar':'Continuar'}</button>${OB.step>0?'<button class="btn ghost" id="oBack">Atrás</button>':''}</div></div>`;
  const g=$('#oGoal');if(g)g.onclick=e=>{const b=e.target.closest('button');if(b){OB.goal=+b.dataset.v;drawOnb()}};
  const f=$('#oFocus');if(f)f.onclick=e=>{const b=e.target.closest('button');if(b){OB.focus=b.dataset.v;drawOnb()}};
  const nm=$('#oName');if(nm)nm.oninput=e=>OB.name=e.target.value;
  const ex=$('#oExam');if(ex)ex.onchange=e=>OB.exam=e.target.value;
  if($('#oBack'))$('#oBack').onclick=()=>{OB.step--;drawOnb()};
  $('#oNext').onclick=()=>{
    if(OB.step<3){OB.step++;drawOnb();return}
    S.name=(OB.name||'').trim()||'Fanny';S.goal=OB.goal;S.focus=OB.focus;S.exam=OB.exam;S.onb=true;save();
    o.hidden=true;render();
  };
}

/* =========================================================
   ARRANQUE
   ========================================================= */
load();ensureDaily();
const sMsg=checkStreak();save();
render();
if(!S.onb)drawOnb();
else if(sMsg==='froze')toast('Tu protector de racha te cubrió el día que faltaste');
else if(sMsg&&sMsg.startsWith('lost'))toast('Tu racha se reinició. Hoy empieza una nueva.');
</script>
